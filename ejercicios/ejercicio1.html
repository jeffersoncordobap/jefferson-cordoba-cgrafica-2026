<!DOCTYPE html>
<html lang="es">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
    <link rel="stylesheet" href="ejercicio1.css">
</head>

<body>
    <main class="form-page">
        <section class="form-section">
            <header class="form-header">
                <h1>Formulario de registro</h1>
            </header>
    
            <form class="form" action="#" method="post">
                <div class="form-field">
                    <label for="name">Nombre<span class="required-mark" aria-hidden="true">* </span> </label>
                    <input type="text" id="name" name="name" placeholder="Jefferson" required>
                </div>

                <div class="form-field">
                    <label for="email">Correo<span class="required-mark" aria-hidden="true">* </span></label>
                    <input type="email" id="email" name="email" placeholder="usuario@gmail.com" required>
                </div>

                <div class="form-field">
                    <label for="password">Contraseña<span class="required-mark" aria-hidden="true">* </span></label>
                    <input type="password" name="password" id="password" password="password" placeholder="Ingrese su contraseña" required>
                </div>

                <div class="form-field">
                    <label for="accept">Aceptar terminos y condiciones <span class="required-mark" aria-hidden="true">*</span></label>
                    <input type="checkbox" id="accept" accept="accept" required>
                </div>

                <div class="form-actions">
                        <button type="submit" class="button button-primary">
                            Enviar
                        </button>
                    </div>
            </form>

        </section>

    </main>

</body>

</html>
